name: Release

# Every push to main builds the Windows installer. When package.json's version
# has no release yet, the installer and its update metadata (latest.yml) are
# published as GitHub release v<version>, and installed copies pick it up
# through Kasha's updater. Bump the version in package.json to ship an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Is this version released already?
        id: version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released; building only."
            echo "publish=never" >> "$GITHUB_OUTPUT"
          else
            # A published release needs its tag to exist first; electron-builder doesn't create one.
            if ! git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
              git tag "$version"
              git push origin "$version"
            fi
            echo "publish=always" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the installer
        run: npm run build && npx electron-builder --win --publish never
      # One release with every file. electron-builder's own publishing uploads
      # files in parallel, and each upload created its own release when none
      # existed yet: v0.2.1 came out as two releases, one with only the blockmap.
      - name: Publish the release
        if: steps.version.outputs.publish == 'always'
        shell: bash
        run: |
          version="${{ steps.version.outputs.tag }}"
          gh release create "$version" --title "${version#v}" --notes "Kasha ${version#v}" --latest \
            dist/Kasha-Setup-*.exe dist/Kasha-Setup-*.exe.blockmap dist/latest.yml
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v5
        with:
          name: Kasha-Setup
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
